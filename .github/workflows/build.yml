name: Build & Release Jellyfin Plugin

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]           # Release bei Tag z.B. v1.0.0
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:         # Manueller Start möglich

env:
  PLUGIN_NAME: Jellyfin.Plugin.WatchlistTracker
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    name: Build Plugin
    runs-on: ubuntu-latest

    steps:
      # ── 1. Repository auschecken ──────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # Für Git-Tags (Versionierung)

      # ── 2. .NET 8 SDK einrichten ──────────────────────────────
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ── 3. NuGet-Cache wiederherstellen ───────────────────────
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ── 4. Abhängigkeiten wiederherstellen ────────────────────
      - name: Restore dependencies
        run: dotnet restore

      # ── 5. Version aus Git-Tag oder Commit ermitteln ──────────
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-ci.${{ github.run_number }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      # ── 6. Plugin bauen ───────────────────────────────────────
      - name: Build plugin
        run: |
          dotnet build --configuration Release --no-restore \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:AssemblyVersion=${{ steps.version.outputs.version }} \
            -p:FileVersion=${{ steps.version.outputs.version }}

      # ── 7. Plugin veröffentlichen (publish) ───────────────────
      - name: Publish plugin
        run: |
          dotnet publish --configuration Release --no-build \
            --output ./publish \
            -p:Version=${{ steps.version.outputs.version }}

      # ── 8. Plugin-ZIP erstellen (für Jellyfin-Installation) ───
      - name: Create plugin ZIP
        run: |
          cd publish
          # Nur notwendige Dateien für Jellyfin
          zip -r ../${{ env.PLUGIN_NAME }}.zip \
            ${{ env.PLUGIN_NAME }}.dll \
            meta.json \
            Web/ \
            Configuration/configPage.html

      # ── 9. Build-Artefakte hochladen ──────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-plugin-${{ steps.version.outputs.version }}
          path: |
            ${{ env.PLUGIN_NAME }}.zip
            publish/
          retention-days: 30

      # ── 10. Release erstellen (nur bei Tags) ──────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PLUGIN_NAME }}.zip
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Jellyfin Watchlist Tracker v${{ steps.version.outputs.version }}

            ### Installation
            1. Lade `${{ env.PLUGIN_NAME }}.zip` herunter
            2. Entpacke in deinen Jellyfin-Plugin-Ordner:
               - Linux: `/var/lib/jellyfin/plugins/`
               - Docker: `/config/plugins/`
            3. Starte Jellyfin neu
            4. Aktiviere das Plugin im Dashboard unter **Plugins → Meine Plugins**

            ### Änderungen
            Siehe [Commit-Verlauf](https://github.com/${{ github.repository }}/commits/${{ github.ref_name }})
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}

      # ── 11. Build-Zusammenfassung ─────────────────────────────
      - name: Build summary
        run: |
          echo "## ✅ Build erfolgreich" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Eigenschaft | Wert |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch/Tag | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download: [Artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

  # ── Zusätzlicher Job: Tests (optional) ──────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run tests
        run: dotnet test --configuration Release --verbosity normal || echo "Keine Tests vorhanden"
